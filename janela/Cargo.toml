[package]
name = "janela"
description = "Hexagon Call: a janela do softphone (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
dirs = "7.0.0"
keyring = "4.2.0"
notify-rust = "4.19.0"
motor = { path = "../motor" }
nucleo = { path = "../nucleo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
som = { path = "../som" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

# Fechar a notificacao da ligacao pelo id (CloseNotification no D-Bus): o zbus
# ja vem pelo chaveiro e pelo notify-rust.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

