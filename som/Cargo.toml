[package]
name = "som"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
motor = { path = "../motor" }
# A gravacao das ligacoes: Opus em Rust puro (o libopus 1.6 portado, sem C
# para compilar no Windows nem na AppImage) dentro de um arquivo Ogg.
ogg = "0.9.2"
opus-rs = "0.1.42"
# A limpeza da voz (som/src/eco.rs), tudo em Rust puro: o AEC3 e a supressao
# de ruido do WebRTC portados (sonora) e o RNNoise (nnnoiseless).
nnnoiseless = { version = "=0.5.2", default-features = false }
sonora = "=0.3.0"
rtrb = "0.4.1"
rubato = "5.1.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true
