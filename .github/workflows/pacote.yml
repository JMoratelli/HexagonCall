# Hexagon Call - Copyright (c) 2026 Jurandir Moratelli (@JJMoratelli).
# O pacote para instalar (docs/estado.md, "Distribuicao e atualizacao"):
#   - windows: o instalador HexagonCallSetup-X.Y.Z.exe (Inno Setup,
#     pacote/instalador.iss), o HexagonCall.exe solto e o SHA256SUMS.txt;
#   - (depois) linux: a AppImage.
# A mao (Actions > Pacote > Run workflow): so o artefato do GitHub (14 dias).
# Numa tag de versao (vX.Y.Z, igual a versao do Cargo.toml): publica a
# release com os tres anexos, que e onde o atualizador do app procura
# (janela/src/atualizador.rs: a lista de releases, nao a "latest").
name: Pacote

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Compilador do rust-toolchain.toml
        shell: bash
        run: |
          versao="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$versao" --profile minimal
          rustc --version

      - name: A tag e a versao do Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          versao="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${versao}" ]; then
            echo "a tag ${GITHUB_REF_NAME} nao bate com a versao ${versao} do Cargo.toml" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: pacote

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Compila e empacota
        shell: pwsh
        run: ./pacote/windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: HexagonCall-windows
          path: pacote/saida/
          retention-days: 14

      - name: Publica a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" pacote/saida/* \
            --title "Hexagon Call ${GITHUB_REF_NAME#v}" \
            --generate-notes
