[package]
name = "janela"
description = "Hexagon Call: a janela do softphone (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
dirs = "7.0.0"
keyring = "4.2.0"
motor = { path = "../motor" }
nucleo = { path = "../nucleo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
som = { path = "../som" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

# A notificacao da ligacao no Linux (D-Bus). Fechar pelo id (CloseNotification)
# vai direto pelo zbus, que ja vem pelo chaveiro e pelo notify-rust.
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4.19.0"

# O HTTP do atualizador no Linux: o libsoup que o WebKitGTK ja traz (o proxy e
# os certificados do sistema, sem TLS de fora). A mesma versao do Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
soup3 = "0.5.0"
zbus = "5.19.0"

# No Windows, o toast da ligacao (WinRT, com o nome e o icone do app), o
# registro do AUMID no HKCU e a rede do atualizador (Windows.Web.Http: o proxy e
# os certificados do sistema, sem TLS de fora). As mesmas versoes que o Tauri
# ja traz.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Storage_Streams",
    "UI_Notifications",
    "Web_Http",
    "Web_Http_Filters",
    "Web_Http_Headers",
] }
windows-future = "0.3.2"
windows-registry = "0.6.1"

