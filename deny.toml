# Hexagon Call - Copyright (c) 2026 Jurandir Moratelli (@JJMoratelli).
# O que o cargo-deny confere no CI (job "dependencias"):
#   - licencas: o projeto e GPL 3 ou posterior, entao so entra dependencia de
#     licenca que pode ir junto num binario GPL 3 (as permissivas abaixo);
#   - avisos de seguranca (RustSec) e versoes retiradas do crates.io;
#   - so o crates.io como origem.

[graph]
all-features = false
# So os sistemas em que o app roda: o cpal puxa crates de macOS, Android e
# navegador que nunca entram no binario.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Os crates do proprio workspace (GPL) nao sao publicados: ficam de fora.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# nucleo e motor entram por caminho, sem versao: valem porque nada e publicado.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
